apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
- name: Prometheus
  type: prometheus
  access: proxy
  orgId: 1
  url: http://prometheus:9090
  uid: "prometheus_ds"
  jsonData:
    timeInterval: "15s"
  isDefault: true
  version: 1
  editable: true

- name: Loki
  type: loki
  access: proxy
  orgId: 1
  url: http://loki:3100
  uid: "loki_ds"
  isDefault: false
  version: 1
  editable: true
