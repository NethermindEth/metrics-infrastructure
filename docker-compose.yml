services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/:/etc/prometheus/
      - ./prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    restart: unless-stopped
    expose:
      - 9090
    ports:
      - "${NETHERMIND_PROMETHEUS_HOST-127.0.0.1}:9090:9090"
    networks:
      - metrics

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - ./loki_data:/loki
    restart: unless-stopped
    expose:
      - 3100
    ports:
      - "${NETHERMIND_LOKI_HOST-127.0.0.1}:3100:3100"
    networks:
      - metrics

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    # root is needed to read the Docker socket for container log discovery
    user: root
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    expose:
      - 12345
    ports:
      - "${NETHERMIND_ALLOY_HOST-127.0.0.1}:12345:12345"
    networks:
      - metrics

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    expose:
      - 3000
    ports:
      - "${NETHERMIND_GRAFANA_HOST-127.0.0.1}:3000:3000"
    networks:
      - metrics
    volumes:
      - ./grafana/config.ini:/etc/grafana/config.ini
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    command: >
      --config /etc/grafana/config.ini

networks:
  metrics:
    name: nethermind-metrics
